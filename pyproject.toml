[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pktanalyzer"
version = "0.1.0"
description = "A from-scratch packet sniffer, protocol decoder and traffic visualizer for the terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.0"]

[project.scripts]
pktanalyzer = "pktanalyzer.cli:main"

[tool.setuptools]
packages = ["pktanalyzer"]
